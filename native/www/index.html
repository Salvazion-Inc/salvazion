<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#040404" />
    <title>Salvazion</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #040404;
        color: #d8e1d9;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        text-align: center;
      }
      .card {
        max-width: 22rem;
        border: 1px solid rgba(138, 171, 142, 0.22);
        border-radius: 1.25rem;
        padding: 1.5rem;
        background: rgba(10, 10, 10, 0.9);
      }
      h1 {
        margin: 0 0 0.5rem;
        color: #8fd99a;
        font-size: 1.35rem;
      }
      p {
        margin: 0.4rem 0;
        font-size: 0.9rem;
        line-height: 1.45;
        color: #8aab8e;
      }
      code {
        font-size: 0.75rem;
        color: #a8d4ae;
      }
      a {
        color: #8fd99a;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Salvazion</h1>
      <p>Shell nativo listo.</p>
      <p>
        Configura <code>CAPACITOR_SERVER_URL</code> o
        <code>NEXT_PUBLIC_APP_URL</code> para cargar la app en vivo (Vercel).
      </p>
      <p>
        Luego: <code>npm run cap:sync</code>
      </p>
    </div>
  </body>
</html>
