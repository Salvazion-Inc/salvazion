<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="600" viewBox="0 0 400 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#6B8E23" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#0c0c0c"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.4"/>
    </filter>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <rect width="400" height="600" fill="url(#shine)"/>
  <!-- spine accent -->
  <rect x="0" y="0" width="14" height="600" fill="#6B8E23" opacity="0.85"/>
  <rect x="14" y="0" width="3" height="600" fill="#000" opacity="0.35"/>
  <!-- frame -->
  <rect x="34" y="28" width="332" height="544" fill="none" stroke="#6B8E23" stroke-opacity="0.55" stroke-width="1.5"/>
  <rect x="42" y="36" width="316" height="528" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <!-- top ornament -->
  <line x1="80" y1="90" x2="320" y2="90" stroke="#6B8E23" stroke-opacity="0.7" stroke-width="1"/>
  <circle cx="200" cy="90" r="4" fill="#6B8E23"/>
  <!-- mark -->
  <text x="200" y="150" text-anchor="middle" font-size="42" fill="#6B8E23" opacity="0.95">📝</text>
  <!-- title -->
  <text x="200" y="182" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" fill="#F5F7F5" letter-spacing="0.5">
    <tspan x="200" dy="0">Crimes of the</tspan><tspan x="200" dy="36">Educators</tspan>
  </text>
  <!-- divider -->
  <line x1="110" y1="390" x2="290" y2="390" stroke="#6B8E23" stroke-opacity="0.65" stroke-width="1"/>
  <!-- author -->
  <text x="200" y="430" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#C8D0C8" opacity="0.95">
    <tspan x="200" dy="0">Alex Newman &amp; Samuel</tspan><tspan x="200" dy="22">Blumenfeld</tspan>
  </text>
  <!-- bottom brand -->
  <text x="200" y="540" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" letter-spacing="3" fill="#6B8E23" opacity="0.8">SALVAZION</text>
  <text x="200" y="558" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#ffffff" opacity="0.35">BIBLIOTECA RECOMENDADA</text>
</svg>
